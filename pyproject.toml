[project]
name = "digestif"
version = "0.1.0"
description = "Zero-Cost Personal Content Digest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "apscheduler<4",
    "sqlite-vec>=0.1.6",
    "litellm>=1.50.0",
    "google-genai>=2.3.0",
    "trafilatura>=2.0.0",
    "readability-lxml>=0.9.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=1.0.0",
    "jinja2>=3.1.0",
    "premailer>=3.10.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.0",
    "aiosmtplib>=3.0.0",
    "aioimaplib>=1.1.0",
    "pytz>=2024.1",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "freezegun>=1.5.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
digestif = "digestif.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: marks tests as requiring live network calls",
    "golden: marks tests as golden regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true


